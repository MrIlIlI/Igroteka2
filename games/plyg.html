  get score() { return G.bonks; },
  get combo() { return G.combo; },
  get stars() { return G.stars; },
  get scene() { return SCENES[G.scene].name; },
  get muted() { return A.muted; },
  get audio() { return { ctx: !!A.ctx, state: A.ctx ? A.ctx.state : 'none', music: !!MUSIC.timer, voices: A.voices.length }; },
  get time() { return G.time; },
  set time(v) { G.time = Math.max(0, +v || 0); },
  get transPending() { return G.transPending; },
  get hero() { return { x: Math.round(hero.x), y: Math.round(hero.y), vy: Math.round(hero.vy), onGround: !hero.air && !hero.stack, airborne: hero.air }; },
  get creatures() { return CRE.map(function (c) { return { type: c.type, x: Math.round(c.state === 'fly' ? c.fx : c.x), y: Math.round(c.state === 'fly' ? c.fy : c.y), alive: bonkable(c), state: c.state }; }); },
  tap: function (x, y) { IN.queue.push({ x: +x || 0, y: +y || 0, id: 'dbg', width: 0, n: 1 }); },
  jump: function () { spaceAction(); },
  bigBoom: function () { if (G.state === 'start') startGame(); else tryBoom(); },
  setBonks: function (n) { G.bonks = Math.max(0, n | 0); }
};
// ---------- init ------------------------------------------------------------------------------
layout(); initClouds(); for (var ci = 0; ci < CLOUDS.length; ci++) cloudPos(CLOUDS[ci]);
hero.x = 0.22 * L.W; hero.y = L.ground; G.lastLand = { x: hero.x, y: hero.y };
startLoop();
})();
</script>
