<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игротека</title>
<style>
:root {
  --bg: #0E1020; --card: #181B31; --card-2: #242949; --text: #FFFFFF; --muted: #A3A9CC;
  --o1: #FF7A2F; --o2: #FFB020; --robot: #35D0BA;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(circle at 0% 0%, rgba(124, 77, 255, 0.30), transparent 36%),
    radial-gradient(circle at 100% 0%, rgba(190, 80, 255, 0.22), transparent 38%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  padding: 26px 40px 60px;
}
header { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 22px; flex-wrap: wrap; }
h1 {
  margin: 0; font-size: 64px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase;
  background: linear-gradient(90deg, #FFFFFF 0%, #FFE2C2 50%, var(--o2) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.dice {
  font: inherit; font-size: 20px; font-weight: 800; color: var(--text); cursor: pointer;
  background: var(--card); border: 2px solid var(--card-2); border-radius: 999px; padding: 10px 20px;
  transition: transform .15s ease, border-color .15s ease;
}
.dice:hover { border-color: var(--o1); transform: rotate(-4deg); }
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 auto 32px; max-width: 1300px; }
.pill {
  font: inherit; font-size: 21px; font-weight: 600; color: var(--text);
  background: var(--card); border: 2px solid var(--card-2);
  border-radius: 999px; padding: 9px 18px 9px 20px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.pill .n { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--card-2); border-radius: 999px; padding: 2px 8px; }
.pill.active { background: linear-gradient(135deg, var(--o1), var(--o2)); border-color: transparent; color: #1a1000; font-weight: 700; }
.pill.active .n { background: rgba(0,0,0,.18); color: #1a1000; }
.pill.robot { border-color: var(--robot); }
.pill.robot.active { background: linear-gradient(135deg, #1fa58f, var(--robot)); color: #04201b; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 30px 26px; max-width: 1600px; margin: 0 auto; }
.tile { font: inherit; color: inherit; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.cover {
  position: relative; width: 100%; aspect-ratio: 1 / 1;
  border-radius: 20px; overflow: hidden; background: var(--card);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  outline: 3px solid transparent;
  transition: transform 0.15s ease, box-shadow 0.15s ease, outline-color 0.15s ease;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover.pixel img { image-rendering: pixelated; }
.fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 96px; background: linear-gradient(135deg, var(--c, #3d2c6e), #1b1d36);
}
.badge {
  position: absolute; top: 10px; left: 10px; font-size: 13px; font-weight: 800; letter-spacing: 1px;
  background: var(--robot); color: #04201b; border-radius: 999px; padding: 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.tile:hover .cover, .tile:focus-visible .cover {
  transform: translateY(-5px); outline-color: var(--o1);
  box-shadow: 0 0 36px rgba(255, 122, 47, 0.45), 0 14px 30px rgba(0, 0, 0, 0.4);
}
.tile:focus-visible { outline: none; }
.name { margin: 14px 2px 8px; font-size: 21px; font-weight: 700; line-height: 1.2; }
.chips { display: flex; gap: 6px; margin: 0 2px; flex-wrap: wrap; }
.chip { font-size: 15px; color: var(--muted); background: var(--card-2); border-radius: 999px; padding: 3px 10px; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: none;
  align-items: center; justify-content: center; padding: 24px; background: rgba(6, 7, 16, 0.72);
}
.overlay.open { display: flex; }
.sheet {
  position: relative; width: min(560px, 100%); max-height: 100%; overflow: auto;
  background: var(--card); border-radius: 28px; padding: 30px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}
.close {
  position: absolute; top: 14px; right: 14px; width: 56px; height: 56px; z-index: 2;
  border-radius: 50%; border: 0; background: var(--card-2); color: var(--text);
  font-size: 34px; line-height: 1; cursor: pointer;
}
.sheet .cover { width: 240px; margin: 0 auto 22px; }
.sheet h2 { margin: 0 0 8px; font-size: 34px; text-align: center; }
.src { text-align: center; color: var(--muted); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; }
.src.robot { color: var(--robot); }
.desc { font-size: 23px; line-height: 1.4; text-align: center; margin: 0 0 14px; }
.note { font-size: 17px; text-align: center; color: var(--o2); margin: 0 0 16px; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 26px; }
.play {
  display: block; text-align: center; text-decoration: none;
  font-size: 34px; font-weight: 800; letter-spacing: 2px; color: #1a1000;
  background: linear-gradient(135deg, var(--o1), var(--o2));
  border-radius: 999px; padding: 18px;
}
.play:hover { filter: brightness(1.08); }
.play:focus-visible, .close:focus-visible, .pill:focus-visible, .dice:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
</style>

<header>

  jump:      { title: 'Прыжки',      icon: '🏃' },
  adventure: { title: 'Приключения', icon: '🗺️' },
  puzzle:    { title: 'Головоломки', icon: '🧩' },
  think:     { title: 'Думаем',      icon: '🧠' },
  skill:     { title: 'Ловкость',    icon: '⚡' },
  two:       { title: 'На двоих',    icon: '👥' },
  memory:    { title: 'Память',      icon: '🃏' },
  numbers:   { title: 'Счёт',        icon: '🔢' },
  draw:      { title: 'Рисуем',      icon: '🎨' },
  music:     { title: 'Музыка',      icon: '🎵' },
  calm:      { title: 'Спокойно',    icon: '🌙' }
};

let current = 'all';
const overlay = document.getElementById('overlay');

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function fallback(x) { const f = el('div', 'fallback', x.emoji); f.style.setProperty('--c', x.color); return f; }
function cover(x, withBadge) {
  const box = el('div', 'cover' + (x.pixel ? ' pixel' : ''));
  if (x.img) {
    const im = el('img'); im.alt = ''; im.src = x.img;
    im.onerror = () => im.replaceWith(fallback(x));
    box.appendChild(im);
  } else box.appendChild(fallback(x));
  if (withBadge && x.robot) box.appendChild(el('span', 'badge', '🤖 РОБОТ'));
  return box;
}
function matches(x, key) {
  if (key === 'all') return true;
  if (key === 'robot') return !!x.robot;
  if (key === 'two') return x.kind === 'two' || /2/.test(x.players);
  return x.kind === key;
}
function pill(key, icon, label, extra) {
  const n = GAMES.filter(x => matches(x, key)).length;
  const b = el('button', 'pill' + (extra ? ' ' + extra : '') + (current === key ? ' active' : ''));
  b.type = 'button';
  b.appendChild(document.createTextNode(icon + ' ' + label));
  b.appendChild(el('span', 'n', String(n)));
  b.onclick = () => { current = key; renderFilters(); renderGrid(); };
  return b;
}
function renderFilters() {
  const f = document.getElementById('filters');
  f.innerHTML = '';
  f.appendChild(pill('all', '✨', 'Все'));
  if (GAMES.some(x => x.robot)) f.appendChild(pill('robot', '🤖', 'Сделал робот', 'robot'));
  const present = new Set(GAMES.map(g => g.kind));
  Object.keys(KINDS).forEach(k => { if (present.has(k)) f.appendChild(pill(k, KINDS[k].icon, KINDS[k].title)); });
}
function tile(x) {
  const t = el('button', 'tile'); t.type = 'button';
  t.appendChild(cover(x, true));
  t.appendChild(el('div', 'name', x.name));
  const chips = el('div', 'chips');
  chips.appendChild(el('span', 'chip', KINDS[x.kind].icon));
  chips.appendChild(el('span', 'chip', x.age + '+'));
  if (/2/.test(x.players) && x.kind !== 'two') chips.appendChild(el('span', 'chip', '👥'));
  t.appendChild(chips);
  t.onclick = () => openSheet(x);
  return t;
}
function visible() { return GAMES.filter(x => matches(x, current)); }
function renderGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  visible().forEach(x => g.appendChild(tile(x)));
}
function openSheet(x) {
  const c = document.getElementById('sCover'); c.innerHTML = ''; c.appendChild(cover(x, false));
  document.getElementById('sTitle').textContent = x.name;
  const src = document.getElementById('sSrc');
  src.textContent = x.robot ? 'Сделал робот · эксперимент' : x.source;
  src.className = 'src' + (x.robot ? ' robot' : '');
  document.getElementById('sDesc').textContent = x.desc;
  const note = document.getElementById('sNote');
  note.textContent = x.note || ''; note.style.display = x.note ? '' : 'none';
  const m = document.getElementById('sMeta'); m.innerHTML = '';
  [KINDS[x.kind].icon + ' ' + KINDS[x.kind].title, 'от ' + x.age + ' лет', 'игроков: ' + x.players, 'управление: ' + x.controls]
    .forEach(t => m.appendChild(el('span', 'chip', t)));
  document.getElementById('sPlay').href = x.url;
  overlay.classList.add('open');
  document.getElementById('sPlay').focus();
}
function closeSheet() { overlay.classList.remove('open'); }
document.getElementById('close').onclick = closeSheet;
document.getElementById('sPlay').onclick = () => setTimeout(closeSheet, 150);
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.getElementById('dice').onclick = () => {
  const list = visible();
  openSheet(list[Math.floor(Math.random() * list.length)]);
};
renderFilters();
renderGrid();
</script>
</body>
</html>
